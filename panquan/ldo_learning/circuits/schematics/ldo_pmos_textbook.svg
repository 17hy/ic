<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 30px "Segoe UI", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 16px "Segoe UI", Arial, sans-serif; fill: #526070; }
      .label { font: 18px "Segoe UI", Arial, sans-serif; fill: #172033; }
      .small { font: 14px "Segoe UI", Arial, sans-serif; fill: #526070; }
      .tiny { font: 12px "Segoe UI", Arial, sans-serif; fill: #526070; }
      .wire { stroke: #172033; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #526070; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: #172033; }
      .port { fill: #ffffff; stroke: #172033; stroke-width: 2.4; }
      .block { fill: #f7fafc; stroke: #1f2937; stroke-width: 2; rx: 8; }
      .pass { fill: #edf7f1; stroke: #15803d; stroke-width: 2; rx: 8; }
      .ea { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; }
      .driver { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
      .passive { fill: #ffffff; stroke: #475569; stroke-width: 2; rx: 6; }
      .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="900"/>
  <text class="title" x="52" y="58">PMOS LDO textbook schematic from ldo_macromodel.inc</text>
  <text class="subtitle" x="52" y="86">Teaching macro model: pass PMOS + one-pole error amplifier + feedback divider + output capacitor ESR.</text>

  <!-- Input and output rails -->
  <circle class="port" cx="84" cy="160" r="12"/>
  <text class="label" x="42" y="134">VIN</text>
  <path class="wire" d="M96 160 H400"/>
  <circle class="node" cx="250" cy="160" r="5"/>

  <path class="wire" d="M660 160 H1368"/>
  <circle class="port" cx="1382" cy="160" r="12"/>
  <text class="label" x="1347" y="134">VOUT</text>
  <circle class="node" cx="940" cy="160" r="5"/>
  <circle class="node" cx="1135" cy="160" r="5"/>
  <circle class="node" cx="1260" cy="160" r="5"/>

  <!-- PMOS pass element -->
  <rect class="pass" x="400" y="100" width="260" height="130"/>
  <text class="label" x="530" y="137" text-anchor="middle">Mpass</text>
  <text class="label" x="530" y="164" text-anchor="middle">PMOS pass FET</text>
  <text class="small" x="530" y="191" text-anchor="middle">S,B tied to VIN</text>
  <path class="thin" d="M425 160 H468 M592 160 H635"/>
  <path class="thin" d="M482 128 V192 M578 128 V192"/>
  <path class="thin" d="M504 160 H556"/>
  <path class="thin" d="M512 188 l-24 -14 l24 -14"/>
  <circle class="node" cx="400" cy="160" r="5"/>
  <circle class="node" cx="660" cy="160" r="5"/>

  <!-- Gate pin and Cgate to VIN -->
  <path class="wire" d="M530 230 V300 H650 V410"/>
  <circle class="node" cx="530" cy="300" r="5"/>
  <text class="small" x="542" y="292">gate probe</text>
  <path class="wire" d="M530 300 H330"/>
  <path class="wire" d="M330 160 V226"/>
  <path class="thin" d="M305 226 H355 M305 248 H355"/>
  <path class="wire" d="M330 248 V300"/>
  <text class="small" x="216" y="244">Cgate = 300p</text>
  <text class="tiny" x="219" y="263">gate-to-VIN</text>

  <!-- Gate clamp / driver -->
  <rect class="driver" x="500" y="410" width="300" height="112"/>
  <text class="label" x="650" y="445" text-anchor="middle">Gate clamp / driver</text>
  <text class="small" x="650" y="474" text-anchor="middle">Vgate = clamp(VIN - Vea)</text>
  <text class="tiny" x="650" y="497" text-anchor="middle">limited between 0 and VIN</text>

  <!-- Error amplifier -->
  <polygon class="ea" points="170,390 170,550 360,470"/>
  <text class="label" x="235" y="454" text-anchor="middle">EA</text>
  <text class="small" x="239" y="480" text-anchor="middle">A0 = 4000</text>
  <text class="tiny" x="242" y="505" text-anchor="middle">one pole: fp = 20 kHz</text>
  <text class="label" x="187" y="433">-</text>
  <text class="label" x="185" y="508">+</text>

  <circle class="port" cx="84" cy="510" r="12"/>
  <text class="label" x="38" y="542">VREF</text>
  <path class="wire" d="M96 510 H170"/>

  <path class="wire" d="M360 470 H500"/>
  <circle class="node" cx="500" cy="470" r="5"/>
  <text class="small" x="383" y="455">ea</text>

  <rect class="passive" x="402" y="545" width="150" height="58"/>
  <text class="small" x="477" y="568" text-anchor="middle">Rea = 10k</text>
  <text class="tiny" x="477" y="589" text-anchor="middle">Cea sets pole</text>
  <path class="thin" d="M360 470 V575 H402 M552 575 H594 V470"/>
  <path class="thin" d="M594 575 V638"/>
  <path class="thin" d="M568 638 H620 M575 652 H613 M584 666 H604"/>
  <text class="tiny" x="612" y="618">Cea</text>

  <!-- Feedback divider -->
  <path class="wire" d="M940 160 V222"/>
  <rect class="passive" x="895" y="222" width="90" height="84"/>
  <text class="small" x="940" y="257" text-anchor="middle">Rtop</text>
  <text class="tiny" x="940" y="280" text-anchor="middle">400k</text>
  <path class="wire" d="M940 306 V360"/>
  <circle class="node" cx="940" cy="360" r="6"/>
  <text class="label" x="960" y="367">FB</text>
  <rect class="passive" x="895" y="410" width="90" height="84"/>
  <text class="small" x="940" y="445" text-anchor="middle">Rbot</text>
  <text class="tiny" x="940" y="468" text-anchor="middle">600k</text>
  <path class="wire" d="M940 360 V410 M940 494 V548"/>
  <path class="thin" d="M912 548 H968 M920 563 H960 M930 578 H950"/>

  <path class="wire" d="M940 360 H140 V430 H170"/>
  <text class="small" x="704" y="345">feedback divider</text>

  <!-- Output capacitor and ESR -->
  <path class="wire" d="M1135 160 V230"/>
  <rect class="passive" x="1090" y="230" width="90" height="68"/>
  <text class="small" x="1135" y="258" text-anchor="middle">ESR</text>
  <text class="tiny" x="1135" y="279" text-anchor="middle">50m</text>
  <path class="wire" d="M1135 298 V345"/>
  <path class="thin" d="M1100 345 H1170 M1100 370 H1170"/>
  <path class="wire" d="M1135 370 V445"/>
  <path class="thin" d="M1107 445 H1163 M1115 460 H1155 M1125 475 H1145"/>
  <text class="small" x="1188" y="358">Cout = 10u</text>

  <!-- Load current sink -->
  <path class="wire" d="M1260 160 V256"/>
  <circle class="passive" cx="1260" cy="312" r="48"/>
  <path class="thin" d="M1260 268 V344" marker-end="url(#arrow)"/>
  <text class="small" x="1319" y="306">Iload</text>
  <text class="tiny" x="1319" y="327">50m nominal</text>
  <path class="wire" d="M1260 360 V445"/>
  <path class="thin" d="M1232 445 H1288 M1240 460 H1280 M1250 475 H1270"/>

  <!-- Notes -->
  <rect class="note" x="56" y="690" width="624" height="118"/>
  <text class="label" x="82" y="724">Model notes</text>
  <text class="small" x="82" y="754">Nominal gain equation: VOUT = VREF * (1 + Rtop/Rbot) = 2.0 V for VREF = 1.2 V.</text>
  <text class="small" x="82" y="781">The behavioral clamp is drawn as a gate driver because it is not a silicon-level driver circuit.</text>

  <rect class="note" x="742" y="690" width="690" height="118"/>
  <text class="label" x="768" y="724">Netlist mapping</text>
  <text class="small" x="768" y="754">Mpass, Rtop, Rbot, Eea_raw/Rea/Cea, Bgate, Cgate, Resr/Cout, and Rbleed are from ldo_macromodel.inc.</text>
  <text class="small" x="768" y="781">The .cir files add VIN, VREF, load current, AC ripple, DC sweeps, and transient stimuli around this core.</text>
</svg>
