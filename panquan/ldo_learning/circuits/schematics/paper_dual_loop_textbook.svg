<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 30px "Segoe UI", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 16px "Segoe UI", Arial, sans-serif; fill: #526070; }
      .label { font: 18px "Segoe UI", Arial, sans-serif; fill: #172033; }
      .small { font: 14px "Segoe UI", Arial, sans-serif; fill: #526070; }
      .tiny { font: 12px "Segoe UI", Arial, sans-serif; fill: #526070; }
      .wire { stroke: #172033; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #526070; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: #172033; }
      .port { fill: #ffffff; stroke: #172033; stroke-width: 2.4; }
      .block { fill: #f7fafc; stroke: #1f2937; stroke-width: 2; rx: 8; }
      .slow { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .fast { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 8; }
      .feed { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
      .passive { fill: #ffffff; stroke: #475569; stroke-width: 2; rx: 6; }
      .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="900"/>
  <text class="title" x="52" y="58">Dual-loop LDO small-signal schematic from paper_dual_loop_ldo.inc</text>
  <text class="subtitle" x="52" y="86">Paper-inspired macro model: supply feedthrough + slow XCEA loop + fast SSF assist loop + passive output network.</text>

  <!-- Ports and output node -->
  <circle class="port" cx="84" cy="180" r="12"/>
  <text class="label" x="35" y="154">vin_ripple</text>
  <path class="wire" d="M96 180 H280"/>

  <path class="wire" d="M500 180 H1368"/>
  <circle class="port" cx="1382" cy="180" r="12"/>
  <text class="label" x="1294" y="154">out_ripple</text>
  <circle class="node" cx="760" cy="180" r="5"/>
  <circle class="node" cx="930" cy="180" r="5"/>
  <circle class="node" cx="1110" cy="180" r="5"/>
  <circle class="node" cx="1260" cy="180" r="5"/>

  <!-- Feedthrough source -->
  <rect class="feed" x="280" y="128" width="220" height="104"/>
  <text class="label" x="390" y="165" text-anchor="middle">Gfeed</text>
  <text class="small" x="390" y="193" text-anchor="middle">VIN ripple feedthrough</text>
  <text class="tiny" x="390" y="215" text-anchor="middle">current injected into output</text>
  <path class="thin" d="M450 180 H500" marker-end="url(#arrow)"/>

  <!-- Passive output network -->
  <path class="wire" d="M930 180 V252"/>
  <rect class="passive" x="885" y="252" width="90" height="76"/>
  <text class="small" x="930" y="282" text-anchor="middle">Rload</text>
  <text class="tiny" x="930" y="304" text-anchor="middle">31</text>
  <path class="wire" d="M930 328 V404"/>
  <path class="thin" d="M902 404 H958 M910 419 H950 M920 434 H940"/>

  <path class="wire" d="M1110 180 V250"/>
  <rect class="passive" x="1065" y="250" width="90" height="68"/>
  <text class="small" x="1110" y="278" text-anchor="middle">ESR</text>
  <text class="tiny" x="1110" y="299" text-anchor="middle">50m</text>
  <path class="wire" d="M1110 318 V365"/>
  <path class="thin" d="M1075 365 H1145 M1075 390 H1145"/>
  <path class="wire" d="M1110 390 V458"/>
  <path class="thin" d="M1082 458 H1138 M1090 473 H1130 M1100 488 H1120"/>
  <text class="small" x="1165" y="378">Cout = 200p</text>

  <!-- Error sensing -->
  <path class="wire" d="M760 180 V292"/>
  <rect class="block" x="642" y="292" width="236" height="94"/>
  <text class="label" x="760" y="328" text-anchor="middle">Eerr</text>
  <text class="small" x="760" y="356" text-anchor="middle">sense output ripple</text>
  <text class="tiny" x="760" y="376" text-anchor="middle">err = out_ripple</text>
  <path class="wire" d="M760 386 V458"/>
  <circle class="node" cx="760" cy="458" r="5"/>
  <text class="small" x="776" y="452">err</text>

  <!-- Slow loop path -->
  <path class="wire" d="M760 458 H500 V558"/>
  <rect class="slow" x="375" y="558" width="250" height="116"/>
  <text class="label" x="500" y="596" text-anchor="middle">Slow XCEA loop</text>
  <text class="small" x="500" y="624" text-anchor="middle">Rslow / Cslow low-pass</text>
  <text class="tiny" x="500" y="646" text-anchor="middle">gm_slow correction current</text>
  <path class="wire" d="M625 616 H760 V180"/>
  <path class="thin" d="M676 616 C720 616 720 520 760 520" marker-end="url(#arrow)"/>
  <text class="tiny" x="646" y="699">Typical: gm_slow = 72, fp_slow = 120 kHz</text>

  <!-- Fast loop path -->
  <path class="wire" d="M760 458 H1015 V558"/>
  <rect class="fast" x="878" y="558" width="274" height="116"/>
  <text class="label" x="1015" y="596" text-anchor="middle">Fast SSF assist loop</text>
  <text class="small" x="1015" y="624" text-anchor="middle">Cfast_hp/Rfast_hp high-pass</text>
  <text class="tiny" x="1015" y="646" text-anchor="middle">Rfast_lp/Cfast_lp limits HF gain</text>
  <path class="wire" d="M1152 616 H1260 V180"/>
  <path class="thin" d="M1192 616 C1240 616 1240 520 1260 520" marker-end="url(#arrow)"/>
  <text class="tiny" x="904" y="699">Typical: gm_fast = 15, fz_fast = 20 MHz, fp_fast = 5 GHz</text>

  <!-- Loop current indicators -->
  <circle class="passive" cx="760" cy="520" r="38"/>
  <path class="thin" d="M760 490 V546" marker-end="url(#arrow)"/>
  <text class="tiny" x="705" y="574">Gslow sinks correction current</text>

  <circle class="passive" cx="1260" cy="520" r="38"/>
  <path class="thin" d="M1260 490 V546" marker-end="url(#arrow)"/>
  <text class="tiny" x="1196" y="574">Gfast sinks fast correction current</text>

  <!-- Ground reference for small signal -->
  <path class="thin" d="M250 700 H1250"/>
  <text class="tiny" x="252" y="724">All return nodes are small-signal ground in this macro model.</text>

  <!-- Notes -->
  <rect class="note" x="56" y="760" width="655" height="96"/>
  <text class="label" x="82" y="794">Model notes</text>
  <text class="small" x="82" y="824">This is a linear small-signal behavioral model, so it is best shown as a control/block schematic.</text>
  <text class="small" x="82" y="848">The conventional comparison in 07/09 sets gm_fast = 0, disabling the fast assist path.</text>

  <rect class="note" x="770" y="760" width="662" height="96"/>
  <text class="label" x="796" y="794">Netlist mapping</text>
  <text class="small" x="796" y="824">Rload, Resr/Cout, Gfeed, Eerr, Rslow/Cslow/Gslow, and Cfast/Rfast/Gfast map directly to paper_dual_loop_ldo.inc.</text>
  <text class="small" x="796" y="848">The .cir files drive this model with AC VIN ripple, sawtooth supply noise, or load-current bounce.</text>
</svg>
